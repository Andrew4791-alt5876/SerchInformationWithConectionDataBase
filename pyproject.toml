[tool.poetry]
name = "serchinformationwithconectiondatabase"
version = "0.1.0"
description = ""
authors = ["Andrei Tiurin"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.34.2"
psycopg2 = "^2.9.13"
psycopg2-binary = "^2.9.13"
python-dotenv = "^1.2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.13"
explicit_package_bases=true
disallow_untyped_defs=true
warn_return_any=true
exclude = ".venv"

[tool.poetry.group.lint.dependencies]
flake8 = ">=7.4.1,<8.0.0"
black = ">=26.5.1,<27.0.0"
isort = ">=9.0.1,<10.0.0"
mypy = ">=2.3.1,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
